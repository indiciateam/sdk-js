name: Generate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SDK version to generate and publish (semver)
        required: true
        type: string
        default: "2.0.2"
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
      - fern
    paths:
      - fern/**
      - .github/workflows/generate.yml

concurrency:
  group: fern-generate
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Setup Fern CLI
        uses: fern-api/setup-fern-cli@v1
        with:
          version: "5.108.0"

      - name: Sync OpenAPI
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          fern api update || curl -fsSL -A "Mozilla/5.0" -o fern/openapi.json https://api.indicia.app/openapi
          python3 fern/scripts/normalize-openapi.py fern/openapi.json
          fern check

      - name: Generate SDK
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="2.0.2"
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"
          fern generate --group ts-sdk --force --version "$VERSION" --log-level info --no-prompt
          python3 fern/scripts/pack-sdk.py sdks/typescript "$VERSION"

      - name: Build SDK
        working-directory: sdks/typescript
        run: |
          npm install
          npx tsc --pretty false
          test -f dist/index.js
          test -f README.md

      - name: Publish to npm
        working-directory: sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if npm view "@indiciaosint/sdk@$CURRENT" version >/dev/null 2>&1; then
            echo "already published @indiciaosint/sdk@$CURRENT"
          else
            npm publish --access public
          fi


