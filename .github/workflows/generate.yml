name: Generate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: SDK version to generate, publish, and release (semver)
        required: true
        type: string

concurrency:
  group: fern-generate
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Setup Fern CLI
        uses: fern-api/setup-fern-cli@v1
        with:
          version: "5.108.0"

      - name: Sync OpenAPI
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          fern api update || curl -fsSL -A "Mozilla/5.0" -o fern/openapi.json https://api.indicia.app/openapi
          python3 fern/scripts/normalize-openapi.py fern/openapi.json
          fern check

      - name: Generate SDK
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          fern generate --group ts-sdk --force --version "$VERSION" --log-level info --no-prompt
          python3 fern/scripts/pack-sdk.py sdks/typescript "$VERSION"

      - name: Build SDK
        working-directory: sdks/typescript
        run: |
          npm install
          npx tsc --pretty false
          test -f dist/index.js
          test -f README.md

      - name: Publish to npm
        working-directory: sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "package.json version $CURRENT != $VERSION"
            exit 1
          fi
          if npm view "@indiciaosint/sdk@$CURRENT" version >/dev/null 2>&1; then
            echo "already published @indiciaosint/sdk@$CURRENT"
          else
            npm publish --access public
          fi

      - name: Create GitHub release
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "typescript - v$VERSION" --generate-notes
          fi
