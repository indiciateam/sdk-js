name: Publish

on:
  release:
    types: [published]

concurrency:
  group: sdk-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Setup Fern CLI
        uses: fern-api/setup-fern-cli@v1
        with:
          version: "5.108.0"

      - name: Sync OpenAPI
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          fern api update || curl -fsSL -A "Mozilla/5.0" -o fern/openapi.json https://api.indicia.app/openapi
          python3 fern/scripts/normalize-openapi.py fern/openapi.json
          fern check

      - name: Generate SDK
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          fern generate --group ts-sdk --force --version "$VERSION" --log-level info --no-prompt
          python3 fern/scripts/pack-sdk.py sdks/typescript "$VERSION"

      - name: Build SDK
        working-directory: sdks/typescript
        run: |
          npm install
          npx tsc --pretty false
          test -f dist/index.js
          test -f README.md

      - name: Publish to npm
        working-directory: sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "package.json version $CURRENT != $VERSION"
            exit 1
          fi
          if npm view "@indiciaosint/sdk@$CURRENT" version >/dev/null 2>&1; then
            echo "already published @indiciaosint/sdk@$CURRENT"
          else
            npm publish --access public
          fi
